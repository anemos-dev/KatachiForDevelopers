name: iOS Build

on:
  pull_request:
    paths:
      - "開発者用メモアプリ/**"
      - "開発者用メモアプリ.xcodeproj/**"
      - "開発者用メモアプリ.xcworkspace/**"
      - "**/Package.resolved"
      - ".github/workflows/ios-build.yml"
  push:
    branches:
      - main
      - developer-menu
      - "feature/**"
    paths:
      - "開発者用メモアプリ/**"
      - "開発者用メモアプリ.xcodeproj/**"
      - "開発者用メモアプリ.xcworkspace/**"
      - "**/Package.resolved"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project '開発者用メモアプリ.xcodeproj'
          -scheme '開発者用メモアプリ'
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
